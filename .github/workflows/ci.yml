# CI workflow for nanalogue-node
# Runs Rust and Node.js checks on push/PR to main

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call: # Allow calling from ci-nightly.yml

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup update
          rustup component add rustfmt clippy

      - name: Install Linux LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              echo "Using clang-$version"
              exit 0
            fi
          done
          echo "Could not install supported clang/libclang version 18-21" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Rust formatting check
        run: cargo fmt -- --check

      - name: Rust clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Node.js lint (Biome)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  # Full test matrix for regular PRs and pushes
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 22 across all platforms (minimum supported version)
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-24.04-arm
            node: "22"
          - os: macos-latest
            node: "22"
          - os: macos-15-intel
            node: "22"
          # Node 24 version coverage on Linux
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-24.04-arm
            node: "24"

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Linux LLVM
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              echo "Using clang-$version"
              exit 0
            fi
          done
          echo "Could not install supported clang/libclang version 18-21" >&2
          exit 1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build native module (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: npm run build

      - name: Build native module (non-Linux)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npm run build

      - name: Run tests
        run: npm test

  # Minimal test for dependabot PRs (just verify deps work)
  test-dependabot:
    name: Test (Dependabot)
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Linux LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              echo "Using clang-$version"
              exit 0
            fi
          done
          echo "Could not install supported clang/libclang version 18-21" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Build native module
        run: npm run build

      - name: Run tests
        run: npm test
