# Publish workflow for nanalogue-node
# Builds native binaries for all platforms and publishes to npm
# Triggers on GitHub Release or manual dispatch (dry-run)

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build & validate without publishing)"
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Verify versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install yq
        run: sudo snap install yq
      - name: Check versions match
        run: |
          V=$(jq -r '.version' package.json)
          echo "Expected version: $V"
          [ "$(yq -p toml -oy '.package.version' Cargo.toml)" = "$V" ] || exit 1
          [ "$(yq -p toml -oy '.package[] | select(.name == "nanalogue-node") | .version' Cargo.lock)" = "$V" ] || exit 1
          for f in npm/*/package.json; do [ "$(jq -r '.version' "$f")" = "$V" ] || exit 1; done
          echo "All versions match"
      - name: Check tag matches version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_V="${TAG#v}"
          V=$(jq -r '.version' package.json)
          [ "$TAG_V" = "$V" ] || { echo "Tag $TAG_V != package.json $V"; exit 1; }

  build:
    name: Build (${{ matrix.compat_tag }})
    needs: version-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds
          - compat_tag: macos-15-intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            node_binary: nanalogue.darwin-x64.node
            lib_ext: dylib
            use_zigbuild: false
          - compat_tag: macos-latest
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            node_binary: nanalogue.darwin-arm64.node
            lib_ext: dylib
            use_zigbuild: false

          # Linux builds via cargo-zigbuild
          - compat_tag: manylinux_2_17_x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            zig_suffix: 2.17
            node_binary: nanalogue.linux-x64-gnu.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: manylinux_2_17_aarch64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            zig_suffix: 2.17
            node_binary: nanalogue.linux-arm64-gnu.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: manylinux_2_17_armv7
            runner: ubuntu-latest
            rust_target: armv7-unknown-linux-gnueabihf
            zig_suffix: 2.17
            node_binary: nanalogue.linux-arm-gnueabihf.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: manylinux_2_29_powerpc64le
            runner: ubuntu-latest
            rust_target: powerpc64le-unknown-linux-gnu
            zig_suffix: 2.29
            node_binary: nanalogue.linux-ppc64-gnu.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: manylinux_2_29_riscv64gc
            runner: ubuntu-latest
            rust_target: riscv64gc-unknown-linux-gnu
            zig_suffix: 2.29
            node_binary: nanalogue.linux-riscv64-gnu.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: musllinux_1_2_x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            node_binary: nanalogue.linux-x64-musl.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: musllinux_1_2_aarch64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            node_binary: nanalogue.linux-arm64-musl.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: musllinux_1_2_arm
            runner: ubuntu-latest
            rust_target: armv7-unknown-linux-musleabihf
            node_binary: nanalogue.linux-arm-musleabihf.node
            lib_ext: so
            use_zigbuild: true
          - compat_tag: musllinux_1_2_powerpc64le
            runner: ubuntu-latest
            rust_target: powerpc64le-unknown-linux-musl
            node_binary: nanalogue.linux-ppc64-musl.node
            lib_ext: so
            use_zigbuild: true

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Rust target
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: rustup target add "$RUST_TARGET"

      - name: Install Linux build dependencies
        if: ${{ matrix.use_zigbuild }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            perl \
            libssl-dev \
            libcurl4-openssl-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            zlib1g-dev

      - name: Install Linux LLVM
        if: ${{ matrix.use_zigbuild }}
        run: |
          set -euo pipefail
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              echo "Using clang-$version"
              exit 0
            fi
          done
          echo "Could not install supported clang/libclang version 18-21" >&2
          exit 1

      - name: Install Zig
        if: ${{ matrix.use_zigbuild }}
        run: |
          set -euo pipefail
          zig_version=0.14.0
          zig_dir="$HOME/.local/zig"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) zig_arch=x86_64 ;;
            aarch64|arm64) zig_arch=aarch64 ;;
            *)
              echo "Unsupported runner architecture for Zig: $arch" >&2
              exit 1
              ;;
          esac
          mkdir -p "$zig_dir"
          curl -fsSL "https://ziglang.org/download/${zig_version}/zig-linux-${zig_arch}-${zig_version}.tar.xz" \
            | tar -xJ --strip-components=1 -C "$zig_dir"
          echo "$zig_dir" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: ${{ matrix.use_zigbuild }}
        run: cargo install --locked cargo-zigbuild

      - name: Determine cargo target
        if: ${{ matrix.use_zigbuild }}
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          ZIG_SUFFIX: ${{ matrix.zig_suffix }}
        run: |
          target="$RUST_TARGET"
          if [ -n "${ZIG_SUFFIX:-}" ]; then
            target="$target.$ZIG_SUFFIX"
          fi
          echo "BUILD_TARGET=$target" >> "$GITHUB_ENV"

      - name: Build native module (macOS)
        if: ${{ !matrix.use_zigbuild }}
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo build --release --target "$RUST_TARGET"

      - name: Build native module (Linux via Zig)
        if: ${{ matrix.use_zigbuild }}
        env:
          BUILD_TARGET: ${{ env.BUILD_TARGET }}
        run: cargo zigbuild --release --target "$BUILD_TARGET"

      - name: Package native module
        env:
          BUILD_TARGET: ${{ env.BUILD_TARGET }}
          LIB_EXT: ${{ matrix.lib_ext }}
          NODE_BINARY: ${{ matrix.node_binary }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          source_target="$RUST_TARGET"
          if [ -n "${BUILD_TARGET:-}" ] && [ -d "target/$BUILD_TARGET/release" ]; then
            source_target="$BUILD_TARGET"
          fi

          mkdir -p dist
          cp "target/$source_target/release/libnanalogue_node.$LIB_EXT" "dist/$NODE_BINARY"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.compat_tag }}
          path: dist/*.node
          if-no-files-found: error

  smoke-test:
    name: Smoke test (${{ matrix.compat_tag }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compat_tag: macos-15-intel
            runner: macos-15-intel
            node_binary: nanalogue.darwin-x64.node
            node_version: "22"
          - compat_tag: macos-latest
            runner: macos-latest
            node_binary: nanalogue.darwin-arm64.node
            node_version: "22"
          - compat_tag: manylinux_2_17_x86_64
            runner: ubuntu-latest
            node_binary: nanalogue.linux-x64-gnu.node
            node_version: "22"
          - compat_tag: manylinux_2_17_aarch64
            runner: ubuntu-24.04-arm
            node_binary: nanalogue.linux-arm64-gnu.node
            node_version: "22"
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: "npm"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Download binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-${{ matrix.compat_tag }}
          path: artifacts

      - name: Place binding in package root
        env:
          NODE_BINARY: ${{ matrix.node_binary }}
        run: |
          cp "artifacts/$NODE_BINARY" .
          ls -la "$NODE_BINARY"

      - name: Run tests
        run: npm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install npm dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Select npm publish artifacts
        run: |
          find artifacts -maxdepth 2 -type f -name "*.node" | sort

          mkdir -p publish-artifacts

          # Publish the broadest-compatibility binary for each npm package target.
          cp artifacts/bindings-macos-15-intel/nanalogue.darwin-x64.node publish-artifacts/
          cp artifacts/bindings-macos-latest/nanalogue.darwin-arm64.node publish-artifacts/
          cp artifacts/bindings-manylinux_2_17_x86_64/nanalogue.linux-x64-gnu.node publish-artifacts/
          cp artifacts/bindings-manylinux_2_17_aarch64/nanalogue.linux-arm64-gnu.node publish-artifacts/
          cp artifacts/bindings-manylinux_2_17_armv7/nanalogue.linux-arm-gnueabihf.node publish-artifacts/
          cp artifacts/bindings-manylinux_2_29_powerpc64le/nanalogue.linux-ppc64-gnu.node publish-artifacts/
          cp artifacts/bindings-manylinux_2_29_riscv64gc/nanalogue.linux-riscv64-gnu.node publish-artifacts/
          cp artifacts/bindings-musllinux_1_2_x86_64/nanalogue.linux-x64-musl.node publish-artifacts/
          cp artifacts/bindings-musllinux_1_2_aarch64/nanalogue.linux-arm64-musl.node publish-artifacts/
          cp artifacts/bindings-musllinux_1_2_arm/nanalogue.linux-arm-musleabihf.node publish-artifacts/
          cp artifacts/bindings-musllinux_1_2_powerpc64le/nanalogue.linux-ppc64-musl.node publish-artifacts/

          ls -la publish-artifacts/*.node

      - name: Copy binaries to platform packages
        run: npx napi artifacts --output-dir publish-artifacts --npm-dir npm

      - name: List packages (dry run info)
        run: |
          echo "=== Main package ==="
          cat package.json
          echo ""
          echo "=== Platform packages ==="
          ls -la npm/

      - name: Publish to npm (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "DRY RUN - would publish the following packages:"
          echo "Main: @nanalogue/node"
          for dir in npm/*/; do
            echo "Platform: $(basename $dir)"
          done
          npm publish --dry-run --provenance --access public

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          # The prepublishOnly hook runs `napi pre-publish` which handles
          # publishing all platform-specific packages before the main package.
          # We only need to run npm publish once on the main package.
          npm publish --provenance --access public
