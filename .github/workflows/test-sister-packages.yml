# Tests the downstream nanalogue-gui package against the current
# nanalogue-node commit. Non-blocking: failures surface as warnings.

name: Test Sister Packages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nanalogue-gui:
    name: nanalogue-gui (Electron + Node.js)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout nanalogue-node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux LLVM
        run: |
          set -euo pipefail
          sudo apt-get update
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              echo "Using clang-$version"
              exit 0
            fi
          done
          echo "Could not install supported clang/libclang version 18-21" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm
        run: |
          npm install -g npm@11.10.0
          npm --version

      - name: Install nanalogue-node dependencies
        run: npm ci

      - name: Build nanalogue-node native module
        run: npm run build

      - name: Checkout nanalogue-gui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: sathish-t/nanalogue-gui
          path: sister/nanalogue-gui

      - name: Install nanalogue-gui dependencies
        working-directory: sister/nanalogue-gui
        run: npm ci

      - name: Override @nanalogue/node with local build
        run: |
          target="sister/nanalogue-gui/node_modules/@nanalogue/node"
          cp index.js index.d.ts native.d.ts "$target/"
          cp nanalogue.linux-x64-gnu.node "$target/" 2>/dev/null || true
          cp nanalogue.linux-x64-musl.node "$target/" 2>/dev/null || true

      - name: Build nanalogue-gui
        working-directory: sister/nanalogue-gui
        run: npm run build

      - name: Lint nanalogue-gui
        working-directory: sister/nanalogue-gui
        run: npm run lint

      - name: Test nanalogue-gui
        working-directory: sister/nanalogue-gui
        run: npm test
